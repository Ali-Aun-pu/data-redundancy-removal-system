services:
  postgres:
    image: postgres:18
    container_name: redundancy_postgres

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./sql/database.sql:/docker-entrypoint-initdb.d/database.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pipeline:
    build: .
    container_name: redundancy_pipeline

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: